<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0d1117" />
  <title>欢乐炸金花 - 在线联机娱乐（宜宾玩法）</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    /* 服务器设置弹窗 */
    .modal-mask { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55); display: flex; align-items: center; justify-content: center; z-index: 99; }
    .modal-box { width: min(88vw, 360px); background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 18px; box-sizing: border-box; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
    .modal-desc { font-size: 12px; color: #8b949e; margin-bottom: 12px; line-height: 1.5; }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  </style>
</head>
<body>
  <!-- 顶部栏 -->
  <header class="topbar">
    <h1 class="logo">🃏 欢乐炸金花</h1>
    <div class="topbar-right">
      <button class="btn btn-ghost btn-sm" id="btnServerSetting">服务器设置</button>
      <div class="conn-status" id="connStatus">连接中...</div>
    </div>
  </header>

  <!-- ============ 页面一：游戏大厅 ============ -->
  <section id="view-lobby" class="view">
    <div class="panel lobby-card">
      <div class="field">
        <label for="nicknameInput">你的昵称</label>
        <input type="text" id="nicknameInput" maxlength="12" placeholder="输入昵称（最多 12 字）" />
      </div>

      <div class="config-box">
        <div class="config-title">创建房间配置（宜宾玩法）</div>
        <div class="config-grid">
          <div class="field">
            <label for="baseScoreInput">底分（虚拟积分）</label>
            <input type="number" id="baseScoreInput" min="1" max="10000" step="1" value="10" />
          </div>
          <div class="field">
            <label for="maxLossInput">单局封顶（虚拟积分）</label>
            <input type="number" id="maxLossInput" min="20" max="1000000" step="10" value="1000" />
          </div>
          <div class="field">
            <label for="openRoundsInput">开牌轮数</label>
            <input type="number" id="openRoundsInput" min="1" max="20" step="1" value="5" />
          </div>
        </div>
        <p class="config-tip">3-8 人开局 · 头家第一轮必闷 · 235 吃豹子 · 闷牌下注为看注一半</p>
      </div>

      <button class="btn btn-primary btn-lg" id="btnCreateRoom">创建房间</button>

      <div class="divider"><span>或</span></div>

      <div class="field">
        <label for="roomIdInput">房间号</label>
        <input type="text" id="roomIdInput" maxlength="6" inputmode="numeric" placeholder="输入 4-6 位房间号" />
      </div>
      <button class="btn btn-secondary btn-lg" id="btnJoinRoom">加入房间</button>

      <div class="divider"><span>房间列表</span></div>
      <div class="room-list" id="roomList">
        <p class="empty-tip">点击下方按钮刷新房间列表</p>
      </div>
      <button class="btn btn-ghost" id="btnRefreshRooms">刷新房间列表</button>
    </div>

    <p class="disclaimer">本游戏为纯娱乐虚拟积分玩法，不含任何现金交易、充值或提现，仅供休闲娱乐。</p>
  </section>

  <!-- ============ 页面二：房间内 ============ -->
  <section id="view-room" class="view hidden">
    <!-- 房间信息条 -->
    <div class="room-bar">
      <div>
        <div class="room-id">房间号：<span id="roomIdLabel">----</span></div>
        <div class="room-tip" id="roomTip">等待其他玩家加入...</div>
      </div>
      <button class="btn btn-danger btn-sm" id="btnLeaveRoom">退出</button>
    </div>

    <!-- 玩家列表 -->
    <div class="players" id="playerList"></div>

    <!-- 牌桌 / 牌局区 -->
    <div class="table">
      <div class="table-head">
        <span id="phaseLabel">阶段：空闲</span>
        <span id="roundLabel">第 0 局</span>
      </div>
      <div class="table-meta">
        <span id="potLabel">底池：0</span>
        <span id="betLabel">当前跟注：--</span>
      </div>
      <div class="turn-tip" id="turnTip">等待房主开始游戏</div>
      <div class="hand-area" id="handArea">
        <p class="empty-tip">牌局未开始</p>
      </div>
      <div class="action-bar" id="actionBar">
        <!-- 房主显示开始按钮 -->
        <button class="btn btn-primary btn-lg hidden" id="btnStartRound">开始游戏</button>

        <!-- 牌局操作（由 game.js 控制显隐） -->
        <button class="btn btn-secondary hidden" id="btnLook">👁 看牌</button>
        <button class="btn btn-primary hidden" id="btnBlind">闷牌（半注）</button>
        <button class="btn btn-primary hidden" id="btnCall">跟注</button>
        <button class="btn btn-secondary hidden" id="btnRaise">加注</button>
        <button class="btn btn-danger hidden" id="btnFold">弃牌</button>
        <button class="btn btn-ghost hidden" id="btnOpen">开牌</button>
      </div>
      <div class="raise-box hidden" id="raiseBox">
        <input type="number" id="raiseAmount" min="1" placeholder="加注后跟注额（需高于当前注额至少一个底分）" />
      </div>
      <div class="log" id="gameLog"><p class="empty-tip">游戏事件会显示在这里</p></div>
    </div>

    <!-- 结算明细面板 -->
    <div class="result-panel hidden" id="resultPanel"></div>
  </section>

  <!-- 服务器设置弹窗 -->
  <div id="serverModal" class="modal-mask hidden">
    <div class="modal-box">
      <div class="modal-title">服务器设置</div>
      <p class="modal-desc">填入部署后得到的服务器地址，格式示例：https://game.xxx.com</p>
      <div class="field">
        <label for="serverUrlInput">服务器地址</label>
        <input type="text" id="serverUrlInput" placeholder="https://game.xxx.com 或 http://ip:3000" />
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="btnServerCancel">取消</button>
        <button class="btn btn-primary" id="btnServerSave">保存</button>
      </div>
    </div>
  </div>

  <!-- 轻提示 -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/net.js"></script>
  <script src="js/game.js"></script>
  <script src="js/ui.js"></script>
</body>
</html>
